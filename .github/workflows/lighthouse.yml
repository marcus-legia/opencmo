name: Lighthouse

# Performance, accessibility, best practices and SEO of the public pages, on a production build of this commit with a
# local Supabase (the Vercel preview is behind SSO and reads the production database). No secret, no paid call.
# Plan: docs/plans/engineering/2026-11-15-lighthouse-ci-plan.md
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_OPENCMO_UI: v2
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3200
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.117.0

      - name: Supabase with what the public pages read (database, API gateway, REST, auth)
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: A made-up catalogue, so the landing page shows its pricing section
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f apps/web/lighthouse/seed.sql

      - name: Point the build at the local stack
        # The local stack's keys are the CLI's fixed demo keys, not secrets.
        run: |
          supabase status -o env | sed -n 's/^\(API_URL\|ANON_KEY\)="\(.*\)"$/\1=\2/p' > /tmp/sb.env
          echo "NEXT_PUBLIC_SUPABASE_URL=$(grep ^API_URL= /tmp/sb.env | cut -d= -f2-)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(grep ^ANON_KEY= /tmp/sb.env | cut -d= -f2-)" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Production build
        run: npm run build --workspace @opencmo/web

      - name: Serve it
        working-directory: apps/web
        run: |
          nohup npm run start -- --port 3200 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3200/login && exit 0; sleep 2; done
          cat /tmp/next.log; exit 1

      - name: Lighthouse (three runs per page, warnings only for now)
        working-directory: apps/web
        run: npx -y @lhci/cli@0.15.1 autorun --config=./lighthouserc.cjs

      - name: Reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: apps/web/.lighthouseci
          include-hidden-files: true
          retention-days: 14

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
