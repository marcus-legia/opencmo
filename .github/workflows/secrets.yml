name: Secrets

# gitleaks over the commits a PR adds (web hardening round 2, item 4). GitHub's own secret scanning knows provider
# formats; this also catches generic keys, passwords in URLs and private keys. The whole history was scanned once on
# 2026-11-16 (no live secret); from here on each PR scans only its own commits. Config and allowlist: .gitleaks.toml.
# The binary is pinned by version and checksum and run directly: no third-party action, no token beyond read.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR's commits and its base, so the scan sees every commit the PR adds, not only the merge result.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan the PR's commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # --redact: a finding's value never reaches the log, which anyone can read on a public repo.
          "$RUNNER_TEMP/gitleaks" git . \
            --config .gitleaks.toml \
            --log-opts="${BASE}..${HEAD}" \
            --redact \
            --no-banner \
            --exit-code 1
