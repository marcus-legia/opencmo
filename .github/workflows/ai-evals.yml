name: AI evals

# Real-model evals of the AI CMO jobs and the editor Assistant. They cost API money and are not
# deterministic, so they never run on pull requests (CI runs the same evals with the fake
# provider). A weekly run grades the small CMO set on both providers and compares each report with
# the previous one of the same suite and provider; a manual run picks the suite, jobs, provider,
# epochs and cap.
#
# API keys live only in the `ai-evals` environment of this workflow (Settings → Environments →
# ai-evals: ANTHROPIC_API_KEY, GEMINI_API_KEY). A provider without a key is skipped with a notice.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "cmo (AI CMO jobs) or agent (editor Assistant)"
        type: choice
        options: [cmo, agent]
        default: cmo
      job:
        description: "cmo: jobs, comma-separated (w1,w2…); agent: a task id or a prefix ending in '-'. Empty = all."
        type: string
        default: ""
      provider:
        type: choice
        options: [fake, anthropic, gemini]
        default: fake
      epochs:
        type: string
        default: "1"
      max_usd:
        description: "Stop starting cases once this many USD are spent"
        type: string
        default: "3"
  schedule:
    # Monday 06:17 UTC: after the weekend's model releases, before the week's prompt work.
    - cron: "17 6 * * 1"

permissions:
  contents: read
  # Reading the previous run's report artifact.
  actions: read

concurrency:
  group: ai-evals-${{ github.event_name }}-${{ inputs.suite || 'cmo' }}
  cancel-in-progress: false

# Actions are pinned to a commit SHA (the tag in the comment), as in ci.yml.
jobs:
  eval:
    name: ${{ matrix.suite }} · ${{ matrix.provider }}
    runs-on: ubuntu-latest
    environment: ai-evals
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'schedule' && '[{"suite":"cmo","provider":"anthropic"},{"suite":"cmo","provider":"gemini"}]' || format('[{{"suite":"{0}","provider":"{1}"}}]', inputs.suite || 'cmo', inputs.provider || 'fake')) }}
    env:
      SUITE: ${{ matrix.suite }}
      PROVIDER: ${{ matrix.provider }}
      # The weekly set: plan, post, Sales and onboarding (the jobs founders see first).
      JOBS: ${{ github.event_name == 'schedule' && 'w1,w2,w4,w0' || inputs.job }}
      EPOCHS: ${{ inputs.epochs || '1' }}
      EVAL_MAX_USD: ${{ inputs.max_usd || '3' }}
      ARTIFACT: eval-${{ matrix.suite }}-${{ matrix.provider }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Key check
        id: key
        run: |
          missing=false
          if [ "$PROVIDER" = anthropic ] && [ -z "$ANTHROPIC_API_KEY" ]; then missing=true; fi
          if [ "$PROVIDER" = gemini ] && [ -z "$GEMINI_API_KEY" ]; then missing=true; fi
          if [ "$missing" = true ]; then
            echo "::notice::No $PROVIDER key in the ai-evals environment; skipping this eval."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.key.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.key.outputs.skip != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - if: steps.key.outputs.skip != 'true'
        run: npm ci

      - name: Explainer renderer and ffmpeg (agent suite)
        # The Assistant's explainer tasks preview scenes with the clip-motion CLI, as in CI.
        if: steps.key.outputs.skip != 'true' && matrix.suite == 'agent'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
          npx -y playwright@1.56.1 install --with-deps chromium-headless-shell
          echo "OPENCMO_MOTION=local" >> "$GITHUB_ENV"
          echo "OPENCMO_MOTION_CHROME=$(ls -d ~/.cache/ms-playwright/chromium_headless_shell-1194/chrome-linux/headless_shell | head -1)" >> "$GITHUB_ENV"

      - name: Previous report
        # The newest unexpired artifact of the same suite and provider, from any earlier run.
        if: steps.key.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=$ARTIFACT&per_page=10" --jq '[.artifacts[] | select(.expired | not)][0].workflow_run.id // empty')
          if [ -n "$run_id" ] && gh run download "$run_id" -R "${{ github.repository }}" -n "$ARTIFACT" -D "$RUNNER_TEMP/base"; then
            base=$(find "$RUNNER_TEMP/base" -name eval-report.json | head -1)
            echo "BASE=$base" >> "$GITHUB_ENV"
            echo "Comparing with run $run_id"
          else
            echo "No previous $ARTIFACT report; this run becomes the baseline."
          fi

      - name: Run the eval
        if: steps.key.outputs.skip != 'true'
        working-directory: apps/web
        # bash with pipefail, so `| tee` does not hide a failing eval.
        shell: bash
        run: |
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          args=(--provider "$PROVIDER" --epochs "$EPOCHS")
          if [ "$PROVIDER" != fake ]; then args+=(--yes); fi
          if [ -n "${BASE:-}" ]; then args+=(--compare "$BASE"); fi
          if [ "$SUITE" = cmo ]; then
            if [ "${{ github.event_name }}" = schedule ]; then
              # The weekly set names jobs that may not be registered yet; keep the ones that are.
              known=",$(npm run -s cmo:eval -- --list-jobs | tail -1),"
              JOBS=$(echo "$JOBS" | tr ',' '\n' | while read -r job; do case "$known" in *",$job,"*) echo "$job";; esac; done | paste -sd, -)
              echo "Weekly jobs: $JOBS"
            fi
            if [ -n "$JOBS" ]; then args+=(--job "$JOBS"); fi
            npm run cmo:eval -- "${args[@]}" --out "$out/eval-report.json" 2>&1 | tee "$out/console.txt"
          else
            if [ -n "$JOBS" ]; then args+=(--task "$JOBS"); fi
            npm run agent:eval -- "${args[@]}" --out "$out" 2>&1 | tee "$out/console.txt"
          fi

      - name: Upload the report
        if: always() && steps.key.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ runner.temp }}/out
          retention-days: 90
          if-no-files-found: ignore
