name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` lets the `full-ci` label start the heavy jobs on a PR.
    types: [opened, synchronize, reopened, ready_for_review, labeled]

# Read-only token: workflows from forks must not be able to write to the repo.
# `pull-requests: read` lets paths-filter list a PR's changed files through the API.
permissions:
  contents: read
  pull-requests: read

# Actions minutes are billed now that the repo is private, so CI only runs what a change touches:
# - every job is gated by the paths it depends on (the `changes` job below);
# - draft PRs run nothing until they are marked ready;
# - the heavy jobs (motion, browsers, parity) run on pushes to main, and on a PR only once it
#   carries the `full-ci` label.
# A label event gets its own concurrency group so adding an unrelated label never cancels a run.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    if: >-
      github.event_name == 'push' ||
      (!github.event.pull_request.draft &&
       (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      web: ${{ steps.filter.outputs.web }}
      motion: ${{ steps.filter.outputs.motion }}
      browsers: ${{ steps.filter.outputs.browsers }}
      parity: ${{ steps.filter.outputs.parity }}
      database: ${{ steps.filter.outputs.database }}
    steps:
      # Pushes are diffed with git (needs a checkout); PRs are diffed through the API.
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - .github/workflows/ci.yml
            node: &node
              - package.json
              - package-lock.json
            engine:
              - *shared
              - packages/engine/**
              - packages/contracts/**
              - packages/clip-*/**
              - packages/editor-parity/**
            web:
              - *shared
              - *node
              - apps/web/**
              - packages/contracts/**
              - packages/clip-*/**
              - packages/editor-core/**
              - packages/skills/**
              - scripts/**
              - tests/**
            motion:
              - *shared
              - *node
              - packages/clip-motion/**
              - packages/clip-media/**
            browsers:
              - *shared
              - *node
              - apps/web/**
              - packages/editor-core/**
              - packages/skills/**
              - packages/clip-*/**
            parity:
              - *shared
              - *node
              - packages/editor-parity/**
              - packages/clip-*/**
            database:
              - *shared
              - supabase/**
              - packages/engine/**

  engine:
    name: engine (python)
    needs: changes
    # Light jobs already ran for this commit when the `full-ci` label is added.
    if: needs.changes.outputs.engine == 'true' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/engine
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        # Canvas render tests build fake videos with ffmpeg (tests/test_canvas_render.py).
        # `ubuntu-latest` 24.04 no longer ships ffmpeg the way 22.04 did.
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint
        run: ruff check opencmo tests modal_app.py

      - name: Test
        run: pytest -q

  web:
    name: web (Next.js)
    needs: changes
    if: needs.changes.outputs.web == 'true' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check:contracts --workspace @opencmo/web
      - run: npm run check:blog --workspace @opencmo/web
      # Clip document: schema, sample documents, JSON Schema for Python.
      - run: npm run check:clip-doc
      - run: npm run test:clip-doc
      - run: npm run check:clip-assets
      - run: npm run test:clip-assets
      - run: npm run check:clip-icons
      - run: npm run test:clip-icons
      - run: npm run check:clip-render
      - run: npm run test:clip-render
      # Operation registry shared by the editor and `/api/v1/editor/ops`.
      - run: npm run check:editor-core
      - run: npm run test:editor-core
      # Style skills: markdown → generated index, frontmatter against the capability registry.
      - run: npm run check:skills
      - run: npm run test:skills
      - run: npm run typecheck
      - run: npm run build

  motion:
    # Explainer renderer (packages/clip-motion): unit tests, then golden stills rendered by
    # Remotion in the same Chrome Headless Shell build the references were drawn with.
    name: motion (clip-motion)
    needs: changes
    if: >-
      needs.changes.outputs.motion == 'true' &&
      (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - name: Chrome Headless Shell 1194 — the build that drew the golden stills
        run: |
          npx -y playwright@1.56.1 install --with-deps chromium-headless-shell
          echo "OPENCMO_MOTION_CHROME=$(ls -d ~/.cache/ms-playwright/chromium_headless_shell-1194/chrome-linux/headless_shell | head -1)" >> "$GITHUB_ENV"
      - run: npm run check:clip-motion

  browsers:
    # The editor outside Chromium (Safari/Firefox): feature detection + library bytes
    # (OPFS, or IndexedDB when createWritable is missing as in Safari 17) on real engines.
    # Needs no Supabase/worker — see apps/web/e2e-compat/compat.spec.ts.
    name: browsers (editor compat)
    needs: changes
    if: >-
      needs.changes.outputs.browsers == 'true' &&
      (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium, Firefox and WebKit
        working-directory: apps/web
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run compat tests on three engines
        working-directory: apps/web
        run: npx playwright test -c playwright.compat.config.ts

  parity:
    # The renderer must match the golden reference images (packages/editor-parity).
    # `--phase A3`: every sample, including text and the 7 caption presets. Reference
    # images are in the repo; samples whose reference is known-broken (`oracleBroken`) are skipped.
    name: parity (clip-render vs DS)
    needs: changes
    if: >-
      needs.changes.outputs.parity == 'true' &&
      (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install ffmpeg
        # Sample video frames are extracted with ffmpeg, as in the server export.
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - name: Chromium 141 — the version that drew the reference images
        # Text rasterization changes between Chromium versions (141 → 153 moved text tiles
        # by up to 55). References were drawn with 141.0.7390.37, which Playwright 1.56.1
        # ships; the repo's Playwright drives it through `CHROMIUM`.
        run: |
          npx -y playwright@1.56.1 install --with-deps chromium
          echo "CHROMIUM=$(ls -d ~/.cache/ms-playwright/chromium-1194/*/chrome | head -1)" >> "$GITHUB_ENV"
      - name: Exporter (clip-export, real ffmpeg)
        run: |
          npm run check:clip-export
          npm run test:clip-export
      - name: Export path (Node, @napi-rs/canvas)
        run: |
          npm run parity:candidate -- --target node
          npm run parity:compare -- --candidate .candidate-node --phase A3 --target node --diff .diff-node
      - name: Preview path (Chromium)
        run: |
          npm run parity:candidate -- --target browser
          npm run parity:compare -- --candidate .candidate-browser --phase A3 --diff .diff-browser
      - name: Upload diff images on mismatch
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: parity-diff
          path: packages/editor-parity/.diff-*
          include-hidden-files: true

  database:
    name: database (Supabase)
    needs: changes
    if: needs.changes.outputs.database == 'true' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          # Pinned: 2.90.0 pulls an older Postgres image that segfaults in pgTAP when a
          # permission-denied error is raised; 2.117.0 (Postgres 17.6.1.167) passes.
          version: 2.117.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Start a database-only Supabase stack
        run: supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      # A fresh runner has no volume: `supabase start` above already created an empty
      # database and applied every migration, so no second reset is needed.
      - name: List migrations
        run: supabase migration list --local
      - name: Run pgTAP
        run: supabase test db
      - name: Database diagnostics on pgTAP failure
        if: failure()
        run: |
          docker inspect supabase_db_opencmo --format '{{json .State}}'
          docker logs supabase_db_opencmo --tail 300
      - name: Lint the database
        run: supabase db lint --local --level warning
      - name: Real multi-connection contention
        run: python -m pytest -q packages/engine/tests/test_web_sql_concurrency.py packages/engine/tests/test_worker_sql.py
      - name: Stop the test stack
        if: always()
        run: supabase stop --no-backup
