<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenCMO script prompter</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f7f6f3}
@media (prefers-color-scheme:dark){body{background:#121110}}
.k{--bg:#f7f6f3;--panel:#ffffff;--raised:#f1efeb;--hover:#ebe8e3;--line:#e7e3dc;--line-2:#d8d2c8;--text:#191816;--muted:#625b52;--subtle:#736c62;--accent:#3b4cca;--accent-ink:#ffffff;--accent-wash:#e9ebfa;--ok:#1e8a5e;
font-family:Geist,ui-sans-serif,system-ui,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
@media (prefers-color-scheme:dark){.k{--bg:#121110;--panel:#181715;--raised:#201e1c;--hover:#262421;--line:#2a2825;--line-2:#36332f;--text:#f2efe9;--muted:#a59e93;--subtle:#8a847b;--accent:#8b97ff;--accent-ink:#0e1024;--accent-wash:#22264a;--ok:#4cc497}}
.k *{box-sizing:border-box}.k button{font:inherit;color:inherit;cursor:pointer}
.k svg.i{width:20px;height:20px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.meta{font-size:12px;color:var(--subtle)}
.mono{font-family:"Geist Mono",ui-monospace,monospace}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--muted);text-decoration:none}
.segs{display:flex;gap:4px}
.segs i{flex:1 1 0;height:4px;border-radius:2px;background:var(--line-2)}
.segs i[data-on="true"]{background:var(--text)}
.kind{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:var(--accent-wash);color:var(--accent);font-size:13px;font-weight:600}
.words{margin:0;font-size:34px;line-height:1.3;font-weight:500;letter-spacing:-0.5px}
.nav{display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:16px;border:1px solid var(--line-2);background:var(--panel);color:var(--text)}
.nav:disabled{opacity:.4;cursor:default}
.play{flex:1 1 auto;height:56px;border-radius:16px;border:0;background:var(--text);color:var(--bg);font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.play[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tap{position:absolute;inset:0;border:0;background:transparent;width:100%}
</style>
</helmet>
<div class="k" style="width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden">

  <header style="display:flex;align-items:center;gap:4px;padding:12px 8px 8px 16px">
    <div style="flex:1 1 auto;min-width:0">
      <div class="meta">Script · 45 s · you film</div>
      <div style="font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Post a launch brief in under a minute</div>
    </div>
    <a href="AgentWriter.dc.html" class="ib" aria-label="Close the prompter"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></a>
  </header>

  <div style="padding:0 16px">
    <div class="segs" aria-hidden="true">
      <sc-for list="{{segs}}" as="g" hint-placeholder-count="4"><i data-on="{{g.on}}"></i></sc-for>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:8px"><span class="meta mono">BEAT {{num}} OF 4</span><span class="meta mono">{{secs}}</span></div>
  </div>

  <div style="position:relative;flex:1 1 auto;display:flex;flex-direction:column;padding:28px 20px 16px;gap:16px;min-height:0">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span class="kind"><sc-if value="{{cam}}" hint-placeholder-val="{{ true }}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:15px;height:15px"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"></path><rect x="2" y="6" width="14" height="12" rx="2"></rect></svg></sc-if><sc-if value="{{scr}}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:15px;height:15px"><rect width="20" height="14" x="2" y="3" rx="2"></rect><line x1="8" x2="16" y1="21" y2="21"></line><line x1="12" x2="12" y1="17" y2="21"></line></svg></sc-if>{{kind}}</span>
    </div>
    <sc-if value="{{hasShow}}" hint-placeholder-val="{{ false }}">
      <div style="font-size:15px;color:var(--muted)">Show: {{show}}</div>
    </sc-if>
    <p class="words">{{words}}</p>
    <div style="flex:1 1 auto"></div>
    <div class="meta" style="text-align:center">Tap the right half for the next beat, the left half to go back</div>
  </div>

  <div style="padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);background:var(--panel)">
    <div style="display:flex;gap:10px;align-items:center">
      <button type="button" class="nav" aria-label="Previous beat" onClick="{{prev}}" disabled="{{atStart}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
      <button type="button" class="play" aria-pressed="{{auto}}" onClick="{{toggleAuto}}">
        <sc-if value="{{autoOff}}" hint-placeholder-val="{{ true }}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>Auto-scroll</sc-if>
        <sc-if value="{{autoOn}}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="14" y="4" width="4" height="16" rx="1"></rect><rect x="6" y="4" width="4" height="16" rx="1"></rect></svg>Scrolling at the beat's pace</sc-if>
      </button>
      <button type="button" class="nav" aria-label="Next beat" onClick="{{next}}" disabled="{{atEnd}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
    </div>
    <div style="display:flex;align-items:center;justify-content:center;gap:6px" class="meta">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:13px;height:13px"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path></svg>
      Screen stays on. Film with your camera app, then upload.
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { b: 1, auto: false }; }
  renderVals() {
    var self = this, s = this.state;
    var beats = [
      { kind: 'To camera', secs: '6 s', show: '', words: 'Creators keep sending screenshots as proof.' },
      { kind: 'Screen', secs: '15 s', show: 'the brief form, then three creators picked', words: 'Fill in the brief. Pick three creators. That is the whole setup.' },
      { kind: 'Screen', secs: '14 s', show: 'the delivered mark on a live post', words: 'When the post goes live on X, Cross Push checks it and marks it delivered.' },
      { kind: 'To camera', secs: '10 s', show: '', words: 'No commission. Link in bio.' }
    ];
    var b = beats[s.b];
    var segs = beats.map(function (x, i) { return { on: i <= s.b ? 'true' : 'false' }; });
    return {
      segs: segs, num: s.b + 1, secs: b.secs, kind: b.kind, cam: b.kind === 'To camera', scr: b.kind === 'Screen',
      hasShow: b.show !== '', show: b.show, words: b.words,
      atStart: s.b === 0, atEnd: s.b === beats.length - 1,
      prev: function () { self.setState({ b: Math.max(0, s.b - 1) }); },
      next: function () { self.setState({ b: Math.min(beats.length - 1, s.b + 1) }); },
      auto: s.auto ? 'true' : 'false', autoOn: s.auto, autoOff: !s.auto,
      toggleAuto: function () { self.setState({ auto: !s.auto }); }
    };
  }
}
</script>
</body>
</html>
