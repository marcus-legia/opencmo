<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenCMO Calendar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f7f6f3}
@media (prefers-color-scheme:dark){body{background:#121110}}
a{color:var(--accent)}a:hover{color:var(--accent-hover)}
.k{--bg:#f7f6f3;--panel:#ffffff;--raised:#f1efeb;--hover:#ebe8e3;--line:#e7e3dc;--line-2:#d8d2c8;--text:#191816;--muted:#625b52;--subtle:#736c62;--accent:#3b4cca;--accent-hover:#2f3fb0;--accent-ink:#ffffff;--accent-wash:#e9ebfa;--ok:#1e8a5e;--ok-wash:#e3f3ec;--warn:#a86a12;--warn-wash:#f8eedc;--top:#ffffff;
font-family:Geist,ui-sans-serif,system-ui,sans-serif;color:var(--text);background:var(--bg);min-height:100vh;font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
@media (prefers-color-scheme:dark){.k{--bg:#121110;--panel:#181715;--raised:#201e1c;--hover:#262421;--line:#2a2825;--line-2:#36332f;--text:#f2efe9;--muted:#a59e93;--subtle:#8a847b;--accent:#8b97ff;--accent-hover:#a8b1ff;--accent-ink:#0e1024;--accent-wash:#22264a;--ok:#4cc497;--ok-wash:#173328;--warn:#e7a948;--warn-wash:#3a2c14;--top:#0e0d0c}}
.k *{box-sizing:border-box}.k button{font:inherit;color:inherit;cursor:pointer}
.k svg.i{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}.k svg.s{width:14px;height:14px}
.top{height:48px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--top)}
.ib{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;border:0;background:transparent;color:var(--muted)}
.ib:hover{background:var(--hover);color:var(--text)}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12.5px}
.pill:hover{color:var(--text)}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}
.seg button{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:6px;border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:500}
.seg button[aria-selected="true"]{background:var(--raised);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.meta{font-size:11.5px;color:var(--subtle)}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:12px}
.chip[aria-pressed="true"]{color:var(--text);border-color:var(--line-2);background:var(--raised)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.day{min-height:520px;border-right:1px solid var(--line);padding:8px 6px;display:flex;flex-direction:column;gap:6px}
.day:last-child{border-right:0}
.dh{display:flex;align-items:baseline;justify-content:space-between;padding:2px 4px 6px;border-bottom:1px solid var(--line);margin-bottom:2px}
.today .dh b{background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:0 6px}
.ev{display:flex;flex-direction:column;gap:3px;text-align:left;width:100%;border:1px solid var(--line);border-left-width:1px;border-radius:7px;background:var(--bg);padding:7px 8px}
.ev:hover{border-color:var(--line-2)}
.ev[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ev .t{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--subtle);font-family:"Geist Mono",ui-monospace,monospace}
.ev .n{font-size:12.5px;line-height:1.35;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-family:Geist,sans-serif;border-radius:4px;padding:0 5px;height:17px}
.st.wait{background:var(--accent-wash);color:var(--accent)}
.st.sch{background:var(--raised);color:var(--muted)}
.st.post{background:var(--ok-wash);color:var(--ok)}
.st.make{background:var(--warn-wash);color:var(--warn)}
.drawer{flex:0 0 380px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
.primary{height:32px;padding:0 14px;border-radius:7px;border:0;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.primary:hover{background:var(--accent-hover)}
.ghost{height:32px;padding:0 12px;border-radius:7px;border:1px solid var(--line-2);background:transparent;color:var(--text);font-size:13px;display:inline-flex;align-items:center;gap:6px}
.vt{display:inline-flex;gap:2px;padding:2px;border-radius:7px;background:var(--bg);border:1px solid var(--line)}
.vt button{height:24px;padding:0 9px;border:0;border-radius:5px;background:transparent;color:var(--muted);font-size:12px}
.vt button[aria-selected="true"]{background:var(--raised);color:var(--text)}
@media (max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.day{min-height:auto;border-bottom:1px solid var(--line)}.drawer{flex:1 1 100%;border-left:0;border-top:1px solid var(--line)}}
</style>
</helmet>
<div class="k">

<header class="top">
  <button type="button" class="pill" style="color:var(--text);gap:8px;border:0;padding:0 8px"><span style="display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:5px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:11px">C</span><span style="font-weight:600">Cross Push</span><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
  <div style="flex:1 1 auto"></div>
  <div class="seg" role="tablist" aria-label="View">
    <button type="button" role="tab" aria-selected="false"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>Feed</button>
    <button type="button" role="tab" aria-selected="true"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M16 2v4"></path><path d="M8 2v4"></path><path d="M3 10h18"></path></svg>Calendar</button>
    <button type="button" role="tab" aria-selected="false"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v16a2 2 0 0 0 2 2h16"></path><path d="M18 17V9"></path><path d="M13 17V5"></path><path d="M8 17v-3"></path></svg>Analytics</button>
  </div>
  <div style="flex:1 1 auto"></div>
  <button type="button" class="pill"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>Chat</button>
  <span style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--line-2);font-size:12px;font-weight:600">T</span>
</header>

<div style="display:flex;flex-wrap:wrap;min-height:calc(100vh - 48px)">
<main style="flex:1 1 640px;min-width:0;padding:16px 20px 32px">
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px">
    <button type="button" class="ib" aria-label="Previous week"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
    <h1 style="margin:0;font-size:20px;font-weight:600;letter-spacing:-0.3px">9 – 15 November</h1>
    <button type="button" class="ib" aria-label="Next week"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
    <button type="button" class="pill">Today</button>
    <div class="seg" role="tablist" aria-label="Range"><button type="button" role="tab" aria-selected="true">Week</button><button type="button" role="tab" aria-selected="false">Month</button></div>
    <div style="flex:1 1 auto"></div>
    <sc-for list="{{chans}}" as="c" hint-placeholder-count="5">
      <button type="button" class="chip" aria-pressed="{{c.on}}" onClick="{{c.pick}}">{{c.label}}</button>
    </sc-for>
  </div>

  <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px" class="meta">
    <span><span class="st wait">Waiting on you</span></span><span><span class="st make">Being made</span></span><span><span class="st sch">Scheduled</span></span><span><span class="st post">Posted</span></span>
    <span style="margin-left:auto">Drag a card to another day to move it. Your CMO asks before it changes a time.</span>
  </div>

  <div class="grid">
    <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
      <div class="{{d.cls}}">
        <div class="dh"><span class="meta">{{d.name}}</span><b style="font-size:13px;font-weight:600">{{d.num}}</b></div>
        <sc-for list="{{d.items}}" as="e" hint-placeholder-count="2">
          <button type="button" class="ev" aria-pressed="{{e.sel}}" onClick="{{e.pick}}">
            <span class="t">{{e.time}} · {{e.chan}}</span>
            <span class="n">{{e.title}}</span>
            <span><span class="{{e.stcls}}">{{e.st}}</span></span>
          </button>
        </sc-for>
      </div>
    </sc-for>
  </div>
</main>

<aside class="drawer" aria-label="Selected item">
  <div style="height:48px;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px;border-bottom:1px solid var(--line)">
    <span style="font-weight:600">{{sel.chan}}</span><span class="meta">· {{sel.day}} {{sel.time}}</span>
    <div style="flex:1 1 auto"></div>
    <button type="button" class="ib" aria-label="Close"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
  </div>
  <div style="padding:16px;display:flex;flex-direction:column;gap:12px;flex:1 1 auto">
    <div><span class="{{sel.stcls}}">{{sel.st}}</span></div>
    <h2 style="margin:0;font-size:16px;font-weight:600;letter-spacing:-0.2px">{{sel.title}}</h2>
    <sc-if value="{{sel.isPost}}" hint-placeholder-val="{{ true }}">
      <div class="vt" role="tablist" aria-label="Versions"><button type="button" role="tab" aria-selected="true">V1</button><button type="button" role="tab" aria-selected="false">V2</button><button type="button" role="tab" aria-selected="false">V3</button></div>
    </sc-if>
    <p style="margin:0;font-size:14px;line-height:1.55;white-space:pre-line">{{sel.body}}</p>
    <div class="meta">{{sel.note}}</div>
  </div>
  <div style="display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)">
    <button type="button" class="ghost"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M16 2v4"></path><path d="M8 2v4"></path><path d="M3 10h18"></path></svg>Move</button>
    <button type="button" class="primary">{{sel.cta}}</button>
  </div>
</aside>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 'x1', chan: 'all' }; }
  renderVals() {
    var self = this, s = this.state;
    var ST = { wait: ['Waiting on you', 'st wait'], make: ['Being made', 'st make'], sch: ['Scheduled', 'st sch'], post: ['Posted', 'st post'] };
    var all = [
      { id: 'p1', d: 0, time: '09:00', chan: 'X', st: 'post', title: 'Proof of delivery, explained', body: 'We shipped the live post check. Here is how it works.', note: '2,140 views · 31 likes · posted from @xpushapp', cta: 'Open stats' },
      { id: 'x1', d: 1, time: '09:30', chan: 'X', st: 'wait', title: 'Screenshots are not proof that a creator posted', body: 'Screenshots are not proof that a creator posted.\nCross Push checks the live post on X before the creator gets paid. If the post comes down, you see it.', note: 'Writer · angle from your strategy: verified delivery', cta: 'Approve and schedule', isPost: true },
      { id: 's1', d: 1, time: '—', chan: 'Script', st: 'wait', title: 'Post a launch brief in under a minute', body: 'Four beats, 45 s, for Shorts. You record it; the editor opens with one marker per beat.', note: 'Writer · you record this one', cta: 'Approve and open in editor' },
      { id: 'sl', d: 2, time: '12:00', chan: 'Slideshow', st: 'make', title: '5 ways to vet a creator', body: 'Studio is building 6 slides from your Brand Kit.', note: 'About 2 minutes left', cta: 'Open when ready' },
      { id: 'sh', d: 2, time: '18:00', chan: 'Shorts', st: 'wait', title: '3 shorts from "How Cross Push checks delivery"', body: 'Three 9:16 clips with captions for TikTok, Reels and Shorts.', note: 'Studio · cut from your finished edit', cta: 'Approve all 3' },
      { id: 'r1', d: 3, time: '—', chan: 'Reddit', st: 'wait', title: 'r/SaaS: How do you prove an influencer posted?', body: 'I check the live post on X, not a screenshot. Screenshots get edited and posts get deleted a day later.', note: 'Sales · score 8/10 · you post it yourself', cta: 'Copy and open thread' },
      { id: 'l1', d: 3, time: '18:00', chan: 'LinkedIn', st: 'sch', title: 'Why we take no commission', body: 'Most creator marketplaces take 20%. We take nothing from the deal.', note: 'You post it: LinkedIn is not connected', cta: 'Copy and open LinkedIn', isPost: true },
      { id: 'x2', d: 4, time: '09:30', chan: 'X', st: 'sch', title: 'A creator rate card, explained', body: 'What goes into a creator rate card on Cross Push.', note: 'Scheduled from @xpushapp', cta: 'Edit', isPost: true },
      { id: 'x3', d: 5, time: '10:00', chan: 'X', st: 'sch', title: 'Week one numbers, in public', body: 'Seven creators signed up this week. Here is where they came from.', note: 'Scheduled from @xpushapp', cta: 'Edit', isPost: true }
    ];
    var chans = ['all', 'X', 'LinkedIn', 'Video', 'Reddit'].map(function (c) {
      return { label: c === 'all' ? 'All' : c, on: s.chan === c ? 'true' : 'false', pick: function () { self.setState({ chan: c }); } };
    });
    var match = function (e) { return s.chan === 'all' || e.chan === s.chan || (s.chan === 'Video' && (e.chan === 'Script' || e.chan === 'Slideshow' || e.chan === 'Shorts')); };
    var names = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    var days = names.map(function (n, i) {
      return {
        name: n, num: 9 + i, cls: i === 0 ? 'day today' : 'day',
        items: all.filter(function (e) { return e.d === i && match(e); }).map(function (e) {
          return { time: e.time, chan: e.chan, title: e.title, st: ST[e.st][0], stcls: ST[e.st][1], sel: s.sel === e.id ? 'true' : 'false', pick: function () { self.setState({ sel: e.id }); } };
        })
      };
    });
    var e = all.filter(function (x) { return x.id === s.sel; })[0] || all[1];
    return {
      chans: chans, days: days,
      sel: { chan: e.chan, day: names[e.d] + ' ' + (9 + e.d) + ' Nov', time: e.time === '—' ? '' : e.time, title: e.title, body: e.body, note: e.note, cta: e.cta, st: ST[e.st][0], stcls: ST[e.st][1], isPost: !!e.isPost }
    };
  }
}
</script>
</body>
</html>
