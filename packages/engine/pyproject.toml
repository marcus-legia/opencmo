[project]
name = "opencmo-engine"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "OpenCMO engine — the worker behind the editor: uploads, export, generation, captions"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    # Output moderation can run on Claude (opencmo/ai/moderation.py).
    "anthropic>=1.4",
    "pydantic>=2.6",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
# Chỉ cần trên máy deploy worker.
worker = ["modal>=0.64"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
opencmo = "opencmo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opencmo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-ignore = [
    # typer BẮT BUỘC gọi typer.Option()/typer.Argument() trong default của tham số
    # — đó là cách khai báo CLI của nó, không phải lỗi.
    "B008",
]
